# Every push and every pull request: the linter, then the tests.
#
# The local-model stack (torch, SAM 2.1) is deliberately not installed -- it is
# gigabytes, and nothing here reaches it: the detection modes that need it are
# skipped in favour of the classic ones.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          # The suite builds its own apps with their own keys; this is only so
          # that importing the app outside a test never picks up the default.
          SECRET_KEY: ci-secret-not-used-for-anything
        run: python -m pytest tests/ -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t mockupgen:ci .
      - name: It starts and answers
        run: |
          docker run -d --name studio -p 5000:5000 \
            -e SECRET_KEY=ci-secret -e ADMIN_PASSWORD=ci-password mockupgen:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/health > /dev/null; then
              echo "healthy after ${attempt}s"; exit 0
            fi
            sleep 1
          done
          echo "the server never answered"; docker logs studio; exit 1
